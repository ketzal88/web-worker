<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:300px;height:250px;overflow:hidden;background:#0f0f0f}
#ad{position:relative;width:300px;height:250px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#1d1d1d 0%,#0b0b0b 70%);color:#f4f1ec;font-family:Oswald,"Arial Narrow",Impact,sans-serif;border:1px solid #2a2a2a;user-select:none;-webkit-user-select:none;cursor:default}
.cond{font-family:Oswald,"Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.sans{font-family:Helvetica,Arial,sans-serif}
.red{color:#e1251b}.green{color:#3ec45a}
#brand{position:absolute;display:flex;align-items:center;gap:5px}
#brand img{display:block}
#brand span{font-weight:700;letter-spacing:.12em}
#eyebrow{position:absolute;font-weight:500;letter-spacing:.14em;color:#9a958d}
#head{position:absolute;font-weight:700;line-height:.95}
#sub{position:absolute;color:#b9b4ab;line-height:1.25}
#reticle{position:absolute}
#stat{position:absolute}
#statLabel{color:#9a958d;letter-spacing:.1em;font-weight:500}
#num{font-weight:700;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s}
#moa{color:#b9b4ab}
#badge{display:inline-block;background:#3ec45a;color:#0b0b0b;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:2px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
#badge.on{opacity:1;transform:none}
#rifleWrap{position:absolute;touch-action:none;cursor:grab;z-index:21}
#coach{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(48,48,48,.62);opacity:0;transition:opacity .45s;pointer-events:none;z-index:20}#coach.on{opacity:1}
#coachTxt{position:absolute;font-weight:700;letter-spacing:.05em;line-height:1.05;color:#fff;text-transform:uppercase;text-align:center;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.7)}#coachTxt b{color:#ff3b30;font-weight:700}
#bigHand{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;pointer-events:none;z-index:22;transform-origin:48% 25%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.65));overflow:visible}#bigHand.on{opacity:1}#rifleWrap:active{cursor:grabbing}
#hand{transition:opacity .35s;pointer-events:none}
#hint{position:absolute;font-weight:500;letter-spacing:.12em;color:#f4f1ec;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
#chips{position:absolute;display:flex;gap:4px}
.chip{border:1px solid #3a3a3a;background:#151515;color:#cfcac2;font-weight:500;letter-spacing:.06em;border-radius:2px;cursor:pointer;text-align:center}
.chip.on{background:#e1251b;border-color:#e1251b;color:#fff}
#cta{position:absolute;white-space:nowrap;background:#e1251b;color:#fff;font-weight:700;letter-spacing:.1em;border:0;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
#cta:hover{background:#ff3326}
#cta.pulse{animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,37,27,.6)}50%{box-shadow:0 0 0 7px rgba(225,37,27,0)}}
#legal{position:absolute;color:#6f6a63;font-family:Helvetica,Arial,sans-serif}

#brand{left:10px;top:8px}#brand img{width:15px;height:14px}#brand span{font-size:9px}
#eyebrow{right:10px;top:10px;font-size:8px}
#head{left:10px;top:26px;font-size:24px}
#sub{display:none}
#reticle{left:8px;top:58px;width:96px;height:96px}
#stat{left:114px;top:62px;width:176px}
#statLabel{font-size:10px}#num{font-size:42px;margin-top:1px}#moa{font-size:10px;margin-top:2px}#badge{position:absolute;right:0;top:26px;font-size:10px}
#rifleWrap{left:8px;top:152px;width:284px;height:62px}
#hint{left:132px;top:150px;font-size:9px}#bigHand{width:104px;height:104px}#coachTxt{left:0;width:300px;top:64px;font-size:30px}
#chips{left:10px;top:221px}.chip{font-size:9px;width:46px;padding:5px 0}
#cta{right:10px;top:219px;width:126px;height:23px;font-size:11px}

</style>

<script>
(function(){
  var MOVE_IN = 0.1/2.54;            // 1 mm unintended movement (0.10 cm, same as the site calculator)
  var L_MIN = 26, L_MAX = 52;        // toe-to-bipod range in inches (site calculator)
  var X0 = 3, PX_PER_IN = (236-3)/52; // svg mapping: toe at x=3
  var L = L_MIN, shown = 0, yd = 1094, userTouched = false, raf;

  var $ = function(id){return document.getElementById(id)};
  var ringNow=$('ringNow'), dotsG=$('dots'), num=$('num'), badge=$('badge'), bipod=$('bipod'), arm=$('arm'),
      span=$('span'), spanTxt=$('spanTxt'), hint=$('hint'), cta=$('cta');

  // mil ticks
  var t='';for(var i=-90;i<=90;i+=10){if(Math.abs(i)<14)continue;var h=i%30===0?5:2.5;
    t+='<line x1="'+i+'" y1="'+(-h)+'" x2="'+i+'" y2="'+h+'"/><line x1="'+(-h)+'" y1="'+i+'" x2="'+h+'" y2="'+i+'"/>';}
  $('ticks').innerHTML=t;

  // fixed impact pattern (unit disk), scaled by current group radius
  var pts=[[.62,-.38],[-.55,.47],[.18,.82],[-.78,-.22],[.4,.35],[-.12,-.7],[.85,.12]], dEls=[];
  pts.forEach(function(){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','2.6');c.setAttribute('fill','#f4f1ec');c.setAttribute('opacity','.85');dotsG.appendChild(c);dEls.push(c);});

  function devIn(l,y){return MOVE_IN*(y*36)/l;}              // linear POI shift, inches
  function moa(l,y){return devIn(l,y)/(1.047*y/100);}
  function mix(a,b,k){return Math.round(a+(b-a)*k);}
  function colorFor(k){return 'rgb('+mix(225,62,k)+','+mix(37,196,k)+','+mix(27,90,k)+')';}

  function render(){
    var target=devIn(L,yd); shown+= (target-shown)*0.25; if(Math.abs(target-shown)<0.05)shown=target;
    var k=Math.min(1,Math.max(0,(L-L_MIN)/(51.2-L_MIN))), col=colorFor(k);
    var r=80*L_MIN/L;
    ringNow.setAttribute('r',r.toFixed(2)); ringNow.setAttribute('stroke',col);
    dEls.forEach(function(c,i){c.setAttribute('cx',(pts[i][0]*r).toFixed(2));c.setAttribute('cy',(pts[i][1]*r).toFixed(2));});
    num.innerHTML=shown.toFixed(1)+'&Prime;'; num.style.color=col;
    $('cmLbl').textContent=Math.round(shown*2.54)+' cm';
    $('moaLbl').textContent=moa(L,yd).toFixed(2)+' MOA';
    var x=X0+L*PX_PER_IN;
    bipod.setAttribute('transform','translate('+x.toFixed(2)+',0)');
    arm.setAttribute('x',120); arm.setAttribute('width',Math.max(0,x-118).toFixed(2));
    span.setAttribute('x2',x.toFixed(2));
    spanTxt.setAttribute('x',((X0+x)/2).toFixed(2));
    spanTxt.textContent=L.toFixed(1)+'″ toe to bipod';
    var cut=Math.round((1-L_MIN/L)*100);
    badge.innerHTML='&minus;'+cut+'% shift'; badge.className=cut>=10?'cond on':'cond';
    raf=requestAnimationFrame(render);
  }

  // distance chips
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(ch){
    ch.addEventListener('click',function(e){e.stopPropagation();stopAttract();
      yd=+ch.getAttribute('data-yd');
      document.querySelectorAll('.chip').forEach(function(o){o.classList.toggle('on',o===ch)});
      $('distLbl').textContent=yd===1760?'1 mile':yd+' yd';});
  });

  // drag
  var wrap=$('rifleWrap'), svg=$('rifle'), dragging=false;
  function setFromEvent(e){
    var b=svg.getBoundingClientRect(), sx=(e.clientX-b.left)/b.width*280;
    L=Math.max(L_MIN,Math.min(L_MAX,(sx-X0)/PX_PER_IN));
  }
  wrap.addEventListener('pointerdown',function(e){stopAttract();dragging=true;try{wrap.setPointerCapture(e.pointerId)}catch(_){ }setFromEvent(e);e.preventDefault();});
  wrap.addEventListener('pointermove',function(e){if(dragging)setFromEvent(e);});
  function end(){if(dragging){dragging=false;if(L>45)cta.classList.add('pulse');}}
  wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);

  // clickthrough (CTA + brand only; the drag zone never opens the page)
  function go(){window.open(window.clickTag,'_blank');}
  cta.addEventListener('click',go); $('brand').addEventListener('click',go); $('head').addEventListener('click',go);

  // attract: a ghost hand drags the bipod forward, lets go, it snaps back to 26" (the problem),
  // then the hand keeps nudging it every few seconds. Stops on first touch; all motion ends by 30 s (IAB).
  var hand=$('hand'), handS=$('handS'), svgEl=$('rifle');
  var intro=[[900,26,26,1,0,1],[2400,26,51.2,1,1,1],[1100,51.2,51.2,1,1,1],[450,51.2,51.2,0,0,0],[900,51.2,26,0,0,0]];
  var tl=intro.slice();
  var nudge=[[500,26,26,1,0],[350,26,26,1,1],[700,26,32,1,1],[250,32,32,1,1],[600,32,26,0,0],[1600,26,26,0,0]];
  tl=tl.concat(nudge,nudge,intro);while(tl.length<60)tl=tl.concat(nudge);
  var seg=0, segStart=null, t0=null, timer;
  function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
  var coach=$('coach'), big=$('bigHand'), knobEl=$('knob'), adEl=$('ad'), HS=big.getBoundingClientRect().width;
  function setCoach(on,press){coach.classList.toggle('on',!!on);big.classList.toggle('on',!!on);if(!on)return;
    var k=knobEl.getBoundingClientRect(), a=adEl.getBoundingClientRect();
    var x=k.left+k.width/2-a.left-HS*.48, y=k.top+k.height/2-a.top-HS*.25;
    big.style.transform='translate('+x+'px,'+y+'px) scale('+(press?.9:1)+') rotate('+(press?-4:0)+'deg)';}
  function setHand(on,press){hand.setAttribute('opacity',on?'1':'0');
    handS.setAttribute('transform','translate(-12.6,'+(press?42.6:41.4)+') scale('+(press?1.0:1.1)+')');}
  function attract(ts){
    if(userTouched)return;
    if(t0===null)t0=ts; if(segStart===null)segStart=ts;
    var s=tl[seg], p=Math.min(1,(ts-segStart)/s[0]);
    L=s[1]+(s[2]-s[1])*ease(p); setCoach(s[5],s[4]); setHand(s[3]&&!s[5],s[4]);
    if(seg===5)hint.classList.add('on');
    if(p>=1){seg++;segStart=ts;}
    if(ts-t0>29000){setHand(0,0);setCoach(0);L=26;cta.classList.add('pulse');try{svgEl.pauseAnimations()}catch(_){ }hint.style.animation='none';return;}
    timer=requestAnimationFrame(attract);
  }
  function stopAttract(){if(!userTouched){userTouched=true;cancelAnimationFrame(timer);setHand(0,0);setCoach(0);hint.classList.remove('on');}}

  render(); timer=requestAnimationFrame(attract);
})();
</script>
