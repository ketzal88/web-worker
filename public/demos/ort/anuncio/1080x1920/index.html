<style>
:root{--w:1080px;--h:1920px;--fs:54px}
/*
 * Estilos del anuncio. Todo en em: el tamaño base (--fs) lo fija cada formato
 * en build.mjs, asi un mismo CSS sirve para 300x250 y para 1080x1920.
 * Solo se animan transform y opacity.
 * Sin fuentes externas: Jost y Open Sans (las de ORT) no se pueden cargar en un
 * anuncio sin pedidos de red, asi que se usa la fuente del sistema.
 * --vivo (#0066FF) es para fondos: sobre --navy no da contraste como texto,
 * por eso el texto de acento usa --cielo.
 */
:root {
  --azul: #004b93;
  --navy: #002b66;
  --vivo: #0066ff;
  --cielo: #8db8ff;
  --texto: #2d3748;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: var(--w);
  height: var(--h);
  overflow: hidden;
  background: var(--navy);
}

#ad {
  position: relative;
  display: flex;
  flex-direction: column;
  width: var(--w);
  height: var(--h);
  overflow: hidden;
  color: #fff;
  font:
    600 var(--fs) / 1.2 system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  background:
    radial-gradient(120% 70% at 100% 0%, rgba(0, 75, 147, 0.6), transparent 62%),
    radial-gradient(90% 50% at 0% 100%, rgba(0, 102, 255, 0.18), transparent 60%),
    var(--navy);
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}

/* Cabecera: logo (blanco, sobre azul) y progreso */
.head {
  display: flex;
  background: var(--azul);
  align-items: center;
  justify-content: space-between;
  gap: 1em;
  padding: 0.5em 1em;
}

.logo {
  display: block;
  height: 2.2em;
  width: auto;
}

.prog {
  display: flex;
  gap: 0.35em;
  opacity: 0;
  transition: opacity 0.3s;
}

.prog.on {
  opacity: 1;
}

.prog i {
  position: relative;
  display: block;
  width: 1.7em;
  height: 0.38em;
  overflow: hidden;
  border-radius: 1em;
  background: rgba(255, 255, 255, 0.3);
}

.prog i::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #fff;
  transform: scaleX(0);
  transform-origin: 0 50%;
  transition: transform 0.35s ease;
}

.prog i.done::after {
  transform: scaleX(1);
}

/* Pantallas */
.stage {
  position: relative;
  flex: 1;
}

.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.8em;
  padding: 0.6em 1.1em 1.1em;
  visibility: hidden;
  opacity: 0;
  transform: translateX(8%);
  pointer-events: none;
  transition:
    opacity 0.25s,
    transform 0.25s,
    visibility 0s 0.25s;
}

.scr.gone {
  transform: translateX(-8%);
}

.scr.on {
  visibility: visible;
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition-delay: 0s;
}

/* Entrada escalonada de los bloques de cada pantalla */
.scr.on .in {
  animation: up 0.42s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: calc(var(--i, 0) * 70ms);
}

@keyframes up {
  from {
    opacity: 0;
    transform: translateY(0.7em);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.kicker {
  color: var(--cielo);
  font-size: 0.85em;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.h {
  font-size: 1.7em;
  font-weight: 800;
  line-height: 1.12;
}

.h em {
  color: var(--cielo);
  font-style: normal;
}

.q {
  font-size: 1.3em;
  font-weight: 800;
  line-height: 1.15;
}

.sub {
  color: rgba(255, 255, 255, 0.82);
  font-size: 1em;
  font-weight: 500;
  line-height: 1.3;
}

/* Cuatro iconos de las areas (solo en formatos altos) */
.trio {
  display: flex;
  gap: 0.6em;
}

.trio span {
  display: grid;
  place-items: center;
  width: 2.6em;
  height: 2.6em;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  color: var(--cielo);
}

.ico {
  display: block;
  width: 1.5em;
  height: 1.5em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Botones */
.cta {
  align-self: flex-start;
  padding: 0.85em 1.6em;
  border-radius: 99em;
  background: var(--vivo);
  color: #fff;
  font-size: 1.1em;
  font-weight: 800;
  transition: transform 0.15s;
}

.cta:hover,
.cta:focus-visible {
  transform: scale(1.04);
}

.cta:active {
  transform: scale(0.97);
}

.chips {
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.82em;
  font-weight: 600;
}

.opts {
  display: flex;
  flex-direction: column;
  gap: 0.6em;
}

.opt {
  display: flex;
  align-items: center;
  gap: 0.8em;
  padding: 0.8em 1em;
  border-radius: 0.9em;
  background: #fff;
  color: var(--texto);
  font-size: 1.05em;
  font-weight: 700;
  text-align: left;
  transition:
    transform 0.15s,
    background-color 0.15s,
    color 0.15s;
}

.opt .ico {
  flex: none;
  width: 1.9em;
  height: 1.9em;
  padding: 0.35em;
  border-radius: 0.6em;
  background: rgba(0, 75, 147, 0.12);
  color: var(--azul);
  transition:
    background-color 0.15s,
    color 0.15s;
}

.opt:hover,
.opt:focus-visible {
  transform: scale(1.025);
  background: var(--azul);
  color: #fff;
}

.opt:hover .ico,
.opt:focus-visible .ico {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}

.opt.picked {
  transform: scale(0.97);
  background: var(--vivo);
  color: #fff;
}

.opt.picked .ico {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}

.again {
  align-self: flex-start;
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.82em;
  font-weight: 600;
  text-decoration: underline;
}

.badge {
  display: grid;
  place-items: center;
  width: 3.4em;
  height: 3.4em;
  border-radius: 50%;
  background: var(--azul);
  color: #fff;
}

.badge .ico {
  width: 1.9em;
  height: 1.9em;
}

/* Invitacion: tras unos segundos sin interaccion, lo que hay que tocar se mueve */
.nudge .scr.on .pri {
  animation: nudge 0.9s ease-in-out 2;
}

.nudge .scr.on .pri:nth-child(2) {
  animation-delay: 0.12s;
}

.nudge .scr.on .pri:nth-child(3) {
  animation-delay: 0.24s;
}

.nudge .scr.on .pri:nth-child(4) {
  animation-delay: 0.36s;
}

@keyframes nudge {
  0%,
  100% {
    transform: none;
  }
  35% {
    transform: scale(1.05);
  }
  65% {
    transform: scale(0.99);
  }
}

/* ---- 300x250: opciones en grilla de 2x2, todo mas compacto ---- */
.s300x250 .head {
  padding: 0.4em 0.9em;
}

.s300x250 .logo {
  height: 1.9em;
}

.s300x250 .scr {
  gap: 0.6em;
  padding: 0.3em 0.9em 0.8em;
}

.s300x250 .trio {
  display: none;
}

.s300x250 .h {
  font-size: 1.55em;
}

.s300x250 .q {
  font-size: 1.2em;
}

.s300x250 .opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4em;
}

.s300x250 .opt {
  flex-direction: row;
  align-items: center;
  gap: 0.4em;
  min-width: 0;
  padding: 0.4em 0.5em;
  font-size: 0.8em;
  line-height: 1.1;
  text-align: left;
}

.s300x250 .opt .ico {
  width: 1.6em;
  height: 1.6em;
  padding: 0.25em;
}

.s300x250 .badge,
.s300x250 .again {
  display: none;
}

/* ---- 1080x1920: zonas seguras de Stories (arriba y abajo se tapan con la UI) ---- */
.s1080x1920 .head {
  padding-top: 4.6em;
}

.s1080x1920 .stage {
  margin-bottom: 5.8em;
}

.s1080x1920 .scr {
  gap: 1.1em;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0s !important;
  }
}

</style>
</head>

<script>
/*
 * Logica del anuncio: gancho, 3 preguntas de un toque y resultado con CTA.
 * Sin dependencias ni pedidos de red. La URL de destino es `clickTag`, que se
 * define aparte en el <head> (var clickTag = "...").
 *
 * El orden de las opciones es siempre el mismo en las 3 preguntas:
 * 0 = Tecnologia, 1 = Diseño, 2 = Ciencia, 3 = Musica. El codigo `pre`
 * que se manda al test son los 3 indices elegidos (ej. "021"). Si se cambia el
 * orden o el texto de una pregunta, hay que cambiar tambien src/lib/pre.ts.
 */
(function () {
  "use strict";

  var ICONOS = [
    // Tecnologia: </>
    '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
    // Diseño: cubo 3D
    '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12L4 7.5M12 12v9"/>',
    // Ciencia: matraz
    '<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 001.3 2h12.4a1.5 1.5 0 001.3-2L14 9V3M7.5 15h9"/>',
    // Musica: nota
    '<path d="M9 18V5l11-2v13M9 18a3 3 0 11-3-3 3 3 0 013 3zM20 16a3 3 0 11-3-3 3 3 0 013 3z"/>',
  ];

  var AREAS = [
    {
      nombre: "Tecnología",
      carreras: "Analista de Sistemas · 2 años · 100% online",
    },
    {
      nombre: "Diseño",
      carreras: "Diseño Digital 3D + IA · 100% online",
    },
    {
      nombre: "Ciencia",
      carreras: "Biotecnología · presencial en Sede Almagro",
    },
    {
      nombre: "Música",
      carreras: "Sonido y Producción Musical · presencial en Sede Almagro",
    },
  ];

  var PREGUNTAS = [
    {
      t: "¿Qué disfrutás más?",
      o: [
        "Resolver problemas",
        "Diseñar objetos",
        "Analizar la naturaleza",
        "Escuchar música",
      ],
    },
    {
      t: "¿Qué se te da mejor?",
      o: [
        "Descomponer problemas",
        "Armar modelos",
        "Analizar muestras",
        "Distinguir instrumentos",
      ],
    },
    {
      t: "¿Qué te engancha más?",
      o: [
        "Usar estadísticas",
        "Dibujar planos",
        "Estudiar biología",
        "Tocar un instrumento",
      ],
    },
  ];

  var UTM = "utm_source=display&utm_medium=rich_media&utm_campaign=test_vocacional";
  var ESPERA_MS = 6000;

  var ad = document.getElementById("ad");
  var stage = document.getElementById("stage");
  var prog = document.getElementById("prog");
  var segmentos = prog.getElementsByTagName("i");

  var respuestas = [];
  var actual = null;
  var ocupado = false;
  var timer = 0;
  var pantallaResultado = null;
  var pantallas;

  function icono(i) {
    return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + ICONOS[i] + "</svg>";
  }

  function pantalla(html) {
    var s = document.createElement("section");
    s.className = "scr";
    s.innerHTML = html;
    stage.appendChild(s);
    return s;
  }

  function mostrar(s) {
    if (actual) {
      actual.className = "scr gone";
    }
    s.className = "scr on";
    actual = s;
    armarInvitacion();
  }

  function destino() {
    var url = String(window.clickTag || "");
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    return url + sep + "pre=" + respuestas.join("") + "&" + UTM;
  }

  function area() {
    // gana la mas elegida; si las 3 son distintas, la primera que elegiste
    var cuenta = [0, 0, 0, 0];
    var i;
    for (i = 0; i < respuestas.length; i++) cuenta[respuestas[i]]++;
    var mejor = respuestas[0];
    for (i = 1; i < respuestas.length; i++) {
      if (cuenta[respuestas[i]] > cuenta[mejor]) mejor = respuestas[i];
    }
    return mejor;
  }

  function pantallaPregunta(n) {
    var q = PREGUNTAS[n];
    var botones = "";
    for (var i = 0; i < 4; i++) {
      botones +=
        '<button type="button" class="opt pri" data-i="' + i + '">' +
        icono(i) + "<span>" + q.o[i] + "</span></button>";
    }
    var s = pantalla(
      '<p class="kicker in" style="--i:0">Pregunta ' + (n + 1) + " de 3</p>" +
      '<h2 class="q in" style="--i:1">' + q.t + "</h2>" +
      '<div class="opts in" style="--i:2">' + botones + "</div>"
    );
    s.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest(".opt") : null;
      if (!b || ocupado) return;
      elegir(n, Number(b.getAttribute("data-i")), b);
    });
    return s;
  }

  function elegir(n, i, boton) {
    ocupado = true;
    respuestas[n] = i;
    boton.className += " picked";
    segmentos[n].className = "done";
    setTimeout(function () {
      ocupado = false;
      // pantallas[0] es el gancho: la pregunta n vive en pantallas[n + 1]
      mostrar(n < 2 ? pantallas[n + 2] : resultado());
    }, 260);
  }

  function resultado() {
    var a = area();
    var d = AREAS[a];
    var s = pantalla(
      '<div class="badge in" style="--i:0">' + icono(a) + "</div>" +
      '<p class="kicker in" style="--i:1">Tu perfil apunta a</p>' +
      '<h2 class="h in" style="--i:2"><em>' + d.nombre + "</em></h2>" +
      '<p class="sub in" style="--i:3">' + d.carreras + "</p>" +
      '<div class="in" style="--i:4"><button type="button" class="cta pri" id="ir">Hacé el test completo</button></div>' +
      '<p class="chips in" style="--i:5">Terciario · 4 tecnicaturas</p>' +
      '<button type="button" class="again in" style="--i:6" id="otra">Volver a empezar</button>'
    );
    s.querySelector("#ir").addEventListener("click", function () {
      window.open(destino(), "_blank");
    });
    s.querySelector("#otra").addEventListener("click", reiniciar);
    pantallaResultado = s;
    return s;
  }

  function reiniciar() {
    respuestas = [];
    for (var i = 0; i < segmentos.length; i++) segmentos[i].className = "";
    prog.className = "prog";
    // las preguntas se rearman para sacar el estado "picked"
    for (var n = 1; n <= 3; n++) {
      stage.removeChild(pantallas[n]);
      pantallas[n] = pantallaPregunta(n - 1);
    }
    var vieja = pantallaResultado;
    pantallaResultado = null;
    mostrar(pantallas[0]);
    // se saca despues de la transicion de salida
    setTimeout(function () {
      if (vieja && vieja.parentNode) stage.removeChild(vieja);
    }, 400);
  }

  // Invitacion: si pasan ESPERA_MS sin tocar nada, lo principal se mueve un poco.
  function armarInvitacion() {
    clearTimeout(timer);
    ad.className = ad.className.replace(" nudge", "");
    timer = setTimeout(function () {
      ad.className += " nudge";
      timer = setTimeout(armarInvitacion, 2600);
    }, ESPERA_MS);
  }

  pantallas = [document.getElementById("inicio")];
  pantallas[1] = pantallaPregunta(0);
  pantallas[2] = pantallaPregunta(1);
  pantallas[3] = pantallaPregunta(2);

  document.getElementById("empezar").addEventListener("click", function () {
    prog.className = "prog on";
    mostrar(pantallas[1]);
  });

  ["pointerdown", "pointermove", "touchstart", "keydown"].forEach(function (ev) {
    ad.addEventListener(ev, armarInvitacion, { passive: true });
  });

  actual = pantallas[0];
  actual.className = "scr on";
  armarInvitacion();
})();

</script>
</body>
</html>
